<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Asistent TAGRA</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root{
    --tg-blue:#0b3a6e;
    --tg-blue-m:#1565c0;
    --tg-bg:#f4f7fb;
    --tg-text:#1b2430;
    --tg-muted:#5b6778;
  }
  @media (prefers-color-scheme: dark){
    :root{ --tg-bg:#0f1720; --tg-text:#e6edf5; --tg-muted:#9aa8b8; }
  }
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--tg-bg);color:var(--tg-text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  /* Stav načítání / chyba */
  #tg-state{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:24px;box-sizing:border-box;text-align:center;}
  #tg-state .spin{width:34px;height:34px;border:3px solid rgba(21,101,192,.2);border-top-color:var(--tg-blue-m);
    border-radius:50%;animation:tgspin .8s linear infinite;}
  @keyframes tgspin{to{transform:rotate(360deg)}}
  #tg-state p{margin:0;font-size:15px;line-height:1.45;color:var(--tg-muted);max-width:320px;}
  #tg-state button{font:inherit;font-size:15px;padding:9px 18px;border:0;border-radius:8px;cursor:pointer;
    background:var(--tg-blue-m);color:#fff;}
  #tg-state button[hidden]{display:none;}

  /* Chatwoot/Jarabot widget přes celou plochu okna (okno programu cca 400 × 600) */
  .woot-widget-holder,
  .woot-widget-holder.woot-elements--left,
  .woot-widget-holder.woot-elements--right{
    position:fixed!important;inset:0!important;top:0!important;left:0!important;right:0!important;bottom:0!important;
    width:100%!important;height:100%!important;min-height:0!important;max-height:none!important;
    border-radius:0!important;box-shadow:none!important;opacity:1!important;transform:none!important;
    visibility:visible!important;z-index:2147483000!important;
  }
  .woot-widget-holder iframe{width:100%!important;height:100%!important;border-radius:0!important;}
  .woot-widget-bubble,.woot--bubble-holder{display:none!important;}

  /* Bez WebView2 se stránka otevře v systémovém prohlížeči – na širokém okně chat vycentrovat */
  @media (min-width:760px){
    .woot-widget-holder,
    .woot-widget-holder.woot-elements--left,
    .woot-widget-holder.woot-elements--right{
      left:calc(50% - 260px)!important;right:auto!important;width:520px!important;
      box-shadow:0 0 0 1px rgba(11,58,110,.08),0 12px 40px rgba(11,58,110,.12)!important;
    }
  }
</style>
</head>
<body>
<div id="tg-state" role="status" aria-live="polite">
  <div class="spin" id="tg-spin"></div>
  <p id="tg-msg">Načítám asistenta…</p>
  <button type="button" id="tg-retry" hidden onclick="location.reload()">Zkusit znovu</button>
</div>

<script>
(function () {
  'use strict';

  /* ===== KONFIGURACE – Jarabot účet 118 =====
     Schránka 943 „TDT podpora“ = robot TDT pro technickou podporu programu TAGRA
     (potvrdil Jarabot 9. 11. 2026). Adresu stránky neměnit – je zapsaná v programu. */
  var JARABOT_BASE_URL = 'https://chat.jarabot.com';
  var JARABOT_WEBSITE_TOKEN = 'M8ySNZjHxuPCNXbEzvCSCkA7';
  var LOAD_TIMEOUT_MS = 15000;
  /* ============================================================================== */

  /* --- Parametry z programu TAGRA ---
     app   company / control / driver
     ver   číslo verze programu (např. 366)
     lang  jazyk programu (cs, sk, en, pl, de …)
     lic   číslo online licence, OFFLINE = bez aktivní online licence
     edice např. TAGRA 4, TAGRA MAX, TAGRA TRUCKER
     os    verze Windows, např. Windows 11 (22631)
     okno  „titulek (název formuláře)“, max. 100 znaků
     Osobní údaje řidičů ani kontrol program neposílá. */
  var q = new URLSearchParams(window.location.search);

  function cleanText(v, max) {
    return String(v == null ? '' : v)
      .replace(/[\u0000-\u001F\u007F<>"`]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, max);
  }
  function pick(name, re, max) {
    var v = cleanText(q.get(name), max);
    return re.test(v) ? v : '';
  }

  var APPS = ['company', 'control', 'driver'];
  var appRaw = cleanText(q.get('app'), 10).toLowerCase();
  var langRaw = cleanText(q.get('lang'), 5).toLowerCase().slice(0, 2);

  var p = {
    app: APPS.indexOf(appRaw) > -1 ? appRaw : '',
    ver: pick('ver', /^[0-9A-Za-z._\-]{1,20}$/, 20),
    lang: /^[a-z]{2}$/.test(langRaw) ? langRaw : 'en',
    lic: pick('lic', /^[0-9A-Za-z\-\/]{1,32}$/, 32),
    edice: cleanText(q.get('edice'), 40),
    os: cleanText(q.get('os'), 80),
    okno: cleanText(q.get('okno'), 100)
  };

  /* --- Texty náhradního stavu (CZ/SK/EN, ostatní jazyky → EN) --- */
  var T = {
    cs: { load: 'Načítám asistenta…', err: 'Asistenta se nepodařilo načíst. Zkontrolujte připojení k internetu a zkuste to znovu.', retry: 'Zkusit znovu', title: 'Asistent TAGRA' },
    sk: { load: 'Načítavam asistenta…', err: 'Asistenta sa nepodarilo načítať. Skontrolujte pripojenie k internetu a skúste to znova.', retry: 'Skúsiť znova', title: 'Asistent TAGRA' },
    en: { load: 'Loading the assistant…', err: 'The assistant could not be loaded. Please check your internet connection and try again.', retry: 'Try again', title: 'TAGRA Assistant' }
  };
  var t = T[p.lang] || T.en;
  document.documentElement.lang = p.lang;
  document.title = t.title;
  document.getElementById('tg-msg').textContent = t.load;
  document.getElementById('tg-retry').textContent = t.retry;

  function showError() {
    document.getElementById('tg-spin').style.display = 'none';
    document.getElementById('tg-msg').textContent = t.err;
    document.getElementById('tg-retry').hidden = false;
  }

  /* --- Chatwoot/Jarabot nastavení: bez bubliny, bez pop-outu, jazyk z programu --- */
  window.chatwootSettings = {
    hideMessageBubble: true,
    showPopoutButton: false,
    position: 'right',
    type: 'standard',
    locale: p.lang,
    useBrowserLanguage: false
  };

  var ready = false;
  var timer = setTimeout(function () { if (!ready) { showError(); } }, LOAD_TIMEOUT_MS);

  /* Udržet chat otevřený – v malém okně widget přepne do mobilního režimu s tlačítkem zavřít */
  function keepOpen() {
    var holder = document.querySelector('.woot-widget-holder');
    if (!holder || !window.MutationObserver) { return; }
    new MutationObserver(function () {
      if (holder.classList.contains('woot--hide') && window.$chatwoot) {
        window.$chatwoot.toggle('open');
      }
    }).observe(holder, { attributes: true, attributeFilter: ['class'] });
  }

  /* Atributy kontaktu – zůstávají u kontaktu pro další dotazy (bez okna, to se mění) */
  function contactAttrs() {
    return {
      tagra_zdroj: 'tagra-app',
      tagra_app: p.app || 'nezadano',
      tagra_ver: p.ver || 'nezadano',
      tagra_lang: p.lang,
      tagra_lic: p.lic || 'nezadano',
      tagra_edice: p.edice || 'nezadano',
      tagra_os: p.os || 'nezadano'
    };
  }
  /* Atributy konverzace – co vidí podpora a robot u konkrétního dotazu */
  function conversationAttrs() {
    var a = contactAttrs();
    a.tagra_okno = p.okno || 'nezadano';
    return a;
  }

  function sendAttributes() {
    var cw = window.$chatwoot;
    if (!cw) { return; }
    try { if (cw.setLocale) { cw.setLocale(p.lang); } } catch (e) {}
    try { if (cw.setConversationCustomAttributes) { cw.setConversationCustomAttributes(conversationAttrs()); } } catch (e) {}
    try { if (cw.setCustomAttributes) { cw.setCustomAttributes(contactAttrs()); } } catch (e) {}
  }

  /* Jarabot atributy konverzace při každém volání PŘEPÍŠE (nesloučí) –
     proto se při změně okna posílá vždy celá sada, ne jen tagra_okno. */
  function sendOkno() {
    var cw = window.$chatwoot;
    if (!ready || !cw || !cw.setConversationCustomAttributes) { return; }
    try { cw.setConversationCustomAttributes(conversationAttrs()); } catch (e) {}
  }

  /* --- Změna okna v programu ---
     Program při přechodu do jiného okna pošle:
     window.postMessage({ type: 'tagra-context', okno: '…' }, '*')
     Přijímáme jen zprávy z tohoto okna (ne z iframu widgetu) a z WebView2 hostitele. */
  function onTagraContext(data) {
    if (typeof data === 'string') {
      try { data = JSON.parse(data); } catch (e) { return; }
    }
    if (!data || data.type !== 'tagra-context') { return; }
    var o = cleanText(data.okno, 100);
    if (!o || o === p.okno) { return; }
    p.okno = o;
    sendOkno();
  }
  window.addEventListener('message', function (e) {
    if (e.source && e.source !== window) { return; }
    if (e.origin && e.origin !== window.location.origin) { return; }
    onTagraContext(e.data);
  });
  try {
    if (window.chrome && window.chrome.webview && window.chrome.webview.addEventListener) {
      window.chrome.webview.addEventListener('message', function (e) { onTagraContext(e.data); });
    }
  } catch (e) {}

  window.addEventListener('chatwoot:ready', function () {
    ready = true;
    clearTimeout(timer);
    document.getElementById('tg-state').style.display = 'none';
    sendAttributes();
    try { window.$chatwoot.toggle('open'); } catch (e) {}
    keepOpen();
  });

  /* Po založení konverzace (první zpráva) atributy zopakovat – bez existující
     konverzace se atributy konverzace neuloží. Aktuální okno jde s nimi. */
  window.addEventListener('chatwoot:on-message', function () {
    if (!window.__tgAttrsResent) { window.__tgAttrsResent = true; sendAttributes(); }
  });

  window.addEventListener('chatwoot:error', function () { if (!ready) { clearTimeout(timer); showError(); } });

  /* --- Načtení SDK --- */
  var s = document.createElement('script');
  s.src = JARABOT_BASE_URL.replace(/\/+$/, '') + '/packs/js/sdk.js';
  s.async = true;
  s.defer = true;
  s.onload = function () {
    var sdk = window.jarabotSDK && typeof window.jarabotSDK.run === 'function' ? window.jarabotSDK : window.chatwootSDK;
    if (!sdk || typeof sdk.run !== 'function') { clearTimeout(timer); showError(); return; }
    sdk.run({ websiteToken: JARABOT_WEBSITE_TOKEN, baseUrl: JARABOT_BASE_URL });
  };
  s.onerror = function () { clearTimeout(timer); showError(); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
