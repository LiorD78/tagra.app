# Sezónní hero video (25. 11. 2026): každých 6 h zkontroluje, zda nenastává rovnodennost/slunovrat.
# Pokud ano, počká na přesný okamžik, zapíše nové období do hero-season.txt a commitne ho →
# Netlify web znovu sestaví a hero video se přepne (tools/hero-season-build.mjs). Žádné klíče.
name: Sezónní hero video
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hero-season
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kontrola období
        id: t
        run: echo "r=$(node tools/hero-season-tick.mjs)" >> "$GITHUB_OUTPUT"
      - name: Commit nového období
        if: steps.t.outputs.r == 'changed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add hero-season.txt
          git commit -m "hero-season: $(cat hero-season.txt) [automaticky]"
          git push origin HEAD:"${GITHUB_REF_NAME}"
