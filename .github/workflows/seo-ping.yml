name: SEO Ping (IndexNow + Facebook OG)

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'

  # Ruční spuštění (doplnění seznamu URL bez změny obsahu)
  workflow_dispatch:

jobs:
  seo-ping:
    runs-on: ubuntu-latest
    # Wait for Netlify deploy to complete (~30s typical)
    steps:
      - name: Wait for Netlify deploy
        run: sleep 45

      - name: Ping IndexNow + refresh Facebook OG cache
        uses: LiorD78/seo-pipeline@v2
        with:
          mode: deploy-driven
          host: tagra.app
          indexnow-key: ${{ secrets.INDEXNOW_KEY }}
          fb-access-token: ${{ secrets.FB_APP_ACCESS_TOKEN }}
          url-list: |
            https://tagra.app/
            https://tagra.app/fleet/
            https://tagra.app/driver/
            https://tagra.app/enforcement/
            https://tagra.app/how-it-works/
            https://tagra.app/for-whom/
            https://tagra.app/faq/
            https://tagra.app/contact/
            https://tagra.app/integrations/dkv-live/
            https://tagra.app/articles/
            https://tagra.app/articles/digital-tachograph-symbols/
            https://tagra.app/articles/how-to-download-evaluate-archive-tachograph-data/
