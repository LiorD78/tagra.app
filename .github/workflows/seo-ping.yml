name: SEO Ping (IndexNow + Facebook OG)

# 8. 10. 2026: URL se počítají automaticky.
#  - push: jen HTML změněné v daném pushi (git diff before..sha), bez noindex stránek
#  - ruční spuštění: všechny URL ze sitemap.xml
# Dřív tu byl ručně psaný seznam ~60 URL, takže nové error-kód články (DE/PL/EN/…)
# se IndexNow vůbec neoznamovaly.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'

  # Ruční spuštění = celá sitemapa
  workflow_dispatch:

jobs:
  seo-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve URL list
        id: urls
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="https://tagra.app"
          : > urls.txt
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed -E 's#</?loc>##g' > urls.txt
          else
            git diff --name-only --diff-filter=AMR "$BEFORE" "$SHA" -- '*.html' | while read -r f; do
              case "$f" in
                404.html|docs/*|tools/*|netlify/*|try/email-preview/*) continue ;;
              esac
              [ -f "$f" ] || continue
              grep -qiE '<meta[^>]+noindex|noindex[^>]+name="robots"' "$f" && continue
              if [ "$f" = "index.html" ]; then echo "$BASE/"
              elif [ "${f%/index.html}" != "$f" ]; then echo "$BASE/${f%index.html}"
              else echo "$BASE/$f"; fi
            done | sort -u > urls.txt
          fi
          COUNT=$(grep -c . urls.txt || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "list<<EOF_URLS"
            cat urls.txt
            echo "EOF_URLS"
          } >> "$GITHUB_OUTPUT"
          echo "URLs to ping: $COUNT"
          head -50 urls.txt

      - name: Wait for Netlify deploy
        if: steps.urls.outputs.count != '0'
        run: sleep 45

      - name: Ping IndexNow + refresh Facebook OG cache
        if: steps.urls.outputs.count != '0'
        uses: LiorD78/seo-pipeline@v2
        with:
          mode: deploy-driven
          host: tagra.app
          indexnow-key: ${{ secrets.INDEXNOW_KEY }}
          fb-access-token: ${{ secrets.FB_APP_ACCESS_TOKEN }}
          url-list: ${{ steps.urls.outputs.list }}
